[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-graphrag"
version = "0.1.0"
description = "A portfolio-safe GraphRAG prototype for temporal financial-risk path retrieval and evidence-grounded explanation."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Jade Lian (JiaQi)" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.scripts]
financial-graphrag = "financial_graphrag.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

